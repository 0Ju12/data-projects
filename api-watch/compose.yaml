services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_watch
      POSTGRES_USER: api_watch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U api_watch"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment: &app_env
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
      POSTGRES_HOST: postgres
      POSTGRES_DB: api_watch
      POSTGRES_USER: api_watch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 90"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/report',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
  scheduler:
    build: .
    environment: *app_env
    depends_on:
      app: {condition: service_healthy}
    command: sh -c "while true; do python manage.py monitor; sleep 3600; done"
volumes:
  postgres_data:
