function badge(s){return '<span class="status '+esc(s||'unknown')+'"><i class="dot"></i>'+esc(labels[s]||labels.unknown)+'</span>'}function spark(runs){const xs=runs.slice(0,24).reverse().filter(r=>r.duration_ms!=null);if(xs.length<2)return'<small>이력 '+xs.length+'회 · 축적 중</small>';const max=Math.max(...xs.map(r=>r.duration_ms),1),points=xs.map((r,i)=>(i*118/(xs.length-1))+','+(28-r.duration_ms/max*24)).join(' ');return'<svg class="spark" viewBox="0 0 120 30" role="img" aria-label="실제 검사 응답 시간 추이"><polyline points="'+points+'" fill="none" stroke="#79b7d5" stroke-width="1.8"/></svg>'}

async function load(){$('#reload').disabled=true;$('#error').classList.add('hidden');try{data=await jsonFile('report.json');$('#last-run').textContent='최근 검사 '+fmt(data.last_check_at);const m=age(data.last_check_at);$('#stale').classList.toggle('hidden',m!==null&&m<150);$('#stale').textContent=m===null?'아직 실행된 검사가 없습니다.':('관제 결과가 '+Math.round(m)+'분 전 자료입니다. API 장애가 아니라 검사 작업의 갱신 지연일 수 있습니다.');render()}catch(e){$('#error').classList.remove('hidden');$('#error').textContent='검사 결과를 읽지 못했습니다. '+e.message;$('#view').innerHTML='<div class="empty">표시할 실제 검사 결과가 없습니다. 임의 상태를 생성하지 않습니다.</div>'}finally{$('#reload').disabled=false}}
function history(slug){return data.history.filter(r=>r.target===slug)}function targetName(slug){return data.targets.find(t=>t.slug===slug)?.name||slug}function kpi(label,value,caption){return'<div class="card kpi"><span class="label">'+label+'</span><b>'+value+'</b><small>'+caption+'</small></div>'}

function visualOverview(ts,open,recent){const normal=ts.filter(t=>t.last_run?.status==='healthy').length;const overall=ts.some(t=>t.last_run?.status==='critical')?'critical':ts.some(t=>t.last_run?.status==='warning')?'warning':normal===ts.length&&ts.length?'healthy':'unknown';const names={'usgs':['◎','USGS EARTHQUAKES','전 세계 지진 피드'],'weather':['☀','OPEN-METEO','서울 현재 날씨'],'own-pipeline':['⌁','MY DATA PIPELINE','내 지진 수집 산출물']};return '<section class="hero"><div><div class="eyebrow">DATA OBSERVABILITY / PERSONAL WORKSPACE</div><h2>데이터의 상태를,<br>한눈에 확인하세요.</h2><p>응답부터 최신성, 구조와 품질까지.<br>내 서비스에 도착하는 데이터의 신뢰도를 살펴봅니다.</p>'+badge(overall)+'<div class="hero-meta"><span>◷ 매시간 정기 검사</span><span>↗ 공개 원본 '+ts.length+'곳</span><span>✦ 하루 한 개 AI 학습</span></div></div><div class="signal-panel"><div class="signal-title"><span>SOURCE HEALTH</span><span>최근 검사 기준</span></div>'+ts.map(t=>{const n=names[t.slug]||['◇','PUBLIC SOURCE',t.name];return '<div class="signal-row"><div class="signal-icon">'+n[0]+'</div><div><strong>'+esc(n[2])+'</strong><small>'+esc(n[1])+'</small></div>'+badge(t.last_run?.status)+'</div>'}).join('')+'<div class="status-strip" role="img" aria-label="최근 검사 상태 분포: 정상 '+normal+'개, 전체 '+ts.length+'개">'+ts.map(t=>'<span class="'+esc(t.last_run?.status||'unknown')+'" style="flex:1"></span>').join('')+'</div><div class="mini-caption"><span>현재 정상 '+normal+' / '+ts.length+'</span><span>열린 이슈 '+open.length+'건</span></div></div></section>'}

function overview(){const ts=data.targets,open=data.incidents.filter(i=>!i.resolved_at),recent=data.history.filter(r=>age(r.checked_at)<=1440),good=recent.filter(r=>r.status==='healthy').length;let h=visualOverview(ts,open,recent)+'<div class="kpis">'+kpi('검사 대상',ts.length,'고정된 공개 데이터·운영 산출물')+kpi('최근 검사 정상',ts.filter(t=>t.last_run?.status==='healthy').length+' / '+ts.length,'응답·최신성·품질을 모두 통과')+kpi('열린 이슈',open.length,'실패한 검사 항목별로 기록')+kpi('24시간 검사 성공률',recent.length?Math.round(good/recent.length*100)+'%':'—','실제 표본 '+recent.length+'회 · 가동률 아님')+'</div><div class="title-row"><div><div class="section-index">01 / MONITORED SOURCES</div><h2>API 및 데이터 흐름</h2></div><div class="right"><input id="search" placeholder="대상 검색" value="'+esc(query)+'"><select id="filter"><option value="all">모든 상태</option><option value="healthy">정상</option><option value="warning">주의</option><option value="critical">이상 감지</option></select></div></div><div class="table-wrap"><table class="source-table"><thead><tr><th>대상 / 상세 검사</th><th>최근 상태</th><th>응답 시간</th><th>자료 기준 시각</th><th>이력</th></tr></thead><tbody>';
const rows=ts.filter(t=>(filter==='all'||t.last_run?.status===filter)&&(!query||t.name.toLowerCase().includes(query.toLowerCase())));h+=rows.map(t=>{const r=t.last_run;return'<tr class="clickable" tabindex="0" data-detail="'+esc(t.slug)+'"><td><b>'+esc(t.name)+'</b><small>'+esc(t.spec.kind)+' · 연속 응답 실패 '+t.consecutive_failures+'회</small></td><td>'+badge(r?.status)+'</td><td>'+duration(r?.duration_ms)+'<small>HTTP '+(r?.http_status??'—')+'</small></td><td>'+fmt(r?.data_at)+'<small>현재 검사 '+fmt(r?.checked_at)+'</small></td><td>'+spark(history(t.slug))+'</td></tr>'}).join('')||'<tr><td colspan="5" class="empty">조건에 맞는 대상 없음</td></tr>';h+='</tbody></table></div><div class="grid"><section class="card"><div class="title-row" style="margin:0"><h2>최근 열린 이슈</h2><button id="all-incidents">전체 기록</button></div>'+incidentRows(open.slice(0,4))+'</section><section class="card daily-preview"><span class="badge">DAILY LEARNING · 운영 검사와 별도</span><h2>'+(data.ai_latest?esc(data.ai_latest.title):'오늘의 AI 학습 노트 준비 중')+'</h2><p class="muted">'+(data.ai_latest?esc(data.ai_latest.what):'공식 GitHub 릴리스·모델 메타데이터를 확인해 하루 1개를 소개합니다.')+'</p><button id="ai-shortcut">설명·근거·실습 보기 →</button></section></div>';$('#view').innerHTML=h;$('#filter').value=filter;$('#filter').onchange=e=>{filter=e.target.value;overview()};$('#search').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;overview();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$$('[data-detail]').forEach(el=>{el.onclick=()=>detail(el.dataset.detail);el.onkeydown=e=>{if(e.key==='Enter')detail(el.dataset.detail)}});$('#all-incidents').onclick=()=>change('incidents');$('#ai-shortcut').onclick=()=>change('ai')}
function incidentRows(items){return items.length?items.map(i=>'<div class="list-row"><div>'+badge(i.resolved_at?'healthy':i.severity==='error'?'critical':'warning')+' <b>'+esc(targetName(i.target))+'</b></div><p>'+esc(i.message)+'</p><small class="muted">발생 '+fmt(i.opened_at)+' · 관측 '+i.occurrences+'회'+(i.resolved_at?' · 회복 '+fmt(i.resolved_at):' · 마지막 관측 '+fmt(i.last_seen_at))+'</small></div>').join(''):'<div class="empty">기록된 이슈가 없습니다.</div>'}
function incidents(){let h='<div class="title-row"><h2>장애·품질 이슈 기록</h2><select id="incident-filter"><option value="open">열린 이슈</option><option value="all">전체 기록</option><option value="resolved">회복한 이슈</option></select></div><p class="muted">해당 검사가 실제로 통과한 경우에만 회복으로 기록합니다. 네트워크 실패로 확인하지 못한 데이터 품질은 회복으로 처리하지 않습니다.</p><section class="card" id="inc-list"></section>';$('#view').innerHTML=h;const draw=()=>$('#inc-list').innerHTML=incidentRows(data.incidents.filter(i=>$('#incident-filter').value==='all'||($('#incident-filter').value==='open'?!i.resolved_at:!!i.resolved_at)));$('#incident-filter').onchange=draw;draw()}
function detail(slug){const t=data.targets.find(t=>t.slug===slug),r=t.last_run,runs=history(slug),lat=runs.slice(0,24).map(r=>r.duration_ms).sort((a,b)=>a-b),p95=lat.length>=5?lat[Math.ceil(lat.length*.95)-1]:null;$('#view').innerHTML='<div class="title-row"><h2>'+esc(t.name)+'</h2><button id="back">← 전체 현황</button></div><p class="muted">'+esc(t.spec.description)+'</p><div class="detail-grid"><div class="card">최근 상태<b>'+badge(r?.status)+'</b><small class="muted">'+fmt(r?.checked_at)+'</small></div><div class="card">최근 응답 시간<b>'+duration(r?.duration_ms)+'</b><small class="muted">p95 '+(p95===null?'표본 5회 이상부터 표시':duration(p95))+' · 최대 최근 24회</small></div><div class="card">자료 최신성 허용<b>'+Math.round(t.spec.max_age_seconds/60)+'분</b><small class="muted">기준 필드 '+esc(t.spec.freshness_path)+'</small></div></div><div class="title-row"><h2>검사별 결과</h2><a href="'+esc(t.spec.docs)+'" target="_blank" rel="noopener">원문·API 문서 ↗</a></div><div class="table-wrap"><table class="checks"><thead><tr><th>검사</th><th>판정</th><th>근거</th></tr></thead><tbody>'+(r?.checks||[]).map(c=>'<tr><td>'+esc(c.label)+'</td><td>'+badge(c.ok?'healthy':c.severity==='warning'?'warning':'critical')+'</td><td>'+esc(c.detail)+'</td></tr>').join('')+'</tbody></table></div><div class="grid"><section class="card"><h2>이전 승인 구조와 비교</h2><p class="muted">처음 정상일 때 구조를 저장합니다. 실패한 응답으로 기준을 자동 교체하지 않습니다.</p>'+((r?.schema_diff||[]).length?'<pre>'+esc(JSON.stringify(r.schema_diff,null,2))+'</pre>':'<p>기록된 구조 변경 없음 · 기준 경로 '+t.baseline_fields+'개</p>')+'</section><section class="card"><h2>최근 검사 이력</h2>'+runs.slice(0,12).map(x=>'<div class="list-row">'+badge(x.status)+' <span>'+fmt(x.checked_at)+'</span><p>'+duration(x.duration_ms)+' · HTTP '+(x.http_status??'—')+' · 건수 '+(x.record_count??'해당 없음')+'</p></div>').join('')+'</section></div><p class="footnote">요청 URL: <code>'+esc(t.spec.url)+'</code></p>';$('#back').onclick=overview}
async function lab(){if(!labData){$('#view').innerHTML='<div class="empty">합성 장애 실험 결과를 불러오는 중</div>';try{labData=await jsonFile('lab.json')}catch(e){$('#view').innerHTML='<p class="error">'+esc(e.message)+'</p>';return}}$('#view').innerHTML='<div class="title-row"><h2>장애 실험실</h2><span class="badge">SYNTHETIC · 운영 통계에 미포함</span></div><p class="tab-summary">고정된 합성 응답을 실제 검사 엔진에 넣은 사전 실행 결과입니다. 버튼을 누른 시점에 운영 API에 장애를 일으키거나 Python 검사를 새로 실행하는 기능은 아닙니다.</p><div class="kpis">'+kpi('예상 결과와 일치',labData.passed+' / '+labData.total,'실제 검출 결과를 기대값과 비교')+kpi('실험 실행 시각',fmt(labData.executed_at),'정기 검사 때 실험도 다시 실행')+'</div><div class="case-grid">'+labData.cases.map((c,i)=>'<button class="card lab-case" data-case="'+i+'"><b>'+esc(c.name)+'</b><p>'+esc(c.expected||'오류 없음')+' → '+(c.passed?'예상대로 검출':'불일치')+'</p></button>').join('')+'</div><section id="lab-case" class="card" style="margin-top:20px"></section>';$$('[data-case]').forEach(b=>b.onclick=()=>{const c=labData.cases[+b.dataset.case];$$('[data-case]').forEach(x=>x.classList.toggle('active',x===b));$('#lab-case').innerHTML='<h2>'+esc(c.name)+'</h2><p>HTTP '+c.http_status+' · 예상 '+esc(c.expected||'오류 없음')+'</p><pre>'+esc(typeof c.payload==='string'?c.payload:JSON.stringify(c.payload,null,2))+'</pre><h3>실제 검사 엔진의 판정</h3>'+c.checks.filter(x=>!x.ok).map(x=>'<div class="list-row"><b>'+esc(x.label)+'</b><p>'+esc(x.detail)+'</p></div>').join('')+(c.detected.length?'':'<p class="healthy">오류를 검출하지 않았습니다.</p>')});$('[data-case]').click()}
function ai(){const b=selectedAI||data.ai_latest;if(!b){$('#view').innerHTML='<div class="empty">아직 작성된 일일 학습 노트가 없습니다.</div>';return}$('#view').innerHTML='<div class="title-row"><div><div class="section-index">DAILY INTELLIGENCE / 하루 한 개의 발견</div><h2>오늘의 AI 기술 1개</h2></div><select id="ai-date">'+data.ai_archive.map(x=>'<option value="'+esc(x.date)+'">'+esc(x.date)+' · '+esc(x.technology)+'</option>').join('')+'</select></div><p class="tab-summary">관심 저장소·공개 모델 메타데이터에서 하루 1개를 골라 설명합니다. 전 세계 신기술 전체를 포괄하거나 성능 순위를 판정하는 서비스는 아닙니다.</p><article class="tech"><span class="badge">'+esc(b.label)+'</span><h2>'+esc(b.title)+'</h2><p>'+esc(b.what)+'</p><div class="flow">'+b.flow.map((x,i)=>(i?'<i>→</i>':'')+'<span>'+esc(x)+'</span>').join('')+'</div><p class="footnote">개념적인 활용 흐름이며 해당 릴리스의 실제 아키텍처 변경도는 아닙니다.</p><div class="grid"><div><h3>내 프로젝트와 연결하면</h3><p>'+esc(b.why_for_you)+'</p><h3>오늘의 짧은 실습</h3><ol>'+b.exercise.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p>'+esc(b.exercise.output)+'</p></div><div><h3>원문에서 확인할 내용</h3>'+b.facts.map(x=>'<p><b>'+esc(x.label)+'</b><br>'+esc(x.value)+'</p>').join('')+'<p class="muted">'+esc(b.release_excerpt)+'</p><h3>해석의 한계</h3><ul>'+b.limits.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div><h3>면접·회고 질문</h3><p>'+esc(b.question)+'</p><div class="right">'+b.sources.map(s=>'<a class="button" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+' ↗</a>').join('')+'</div><p class="footnote">발표일: '+fmt(b.official_published_at)+' · 수집일: '+fmt(b.collected_at)+' · 학습일: '+esc(b.date)+'<br>'+esc(b.composition)+'</p>'+(b.fetch_errors.length?'<p class="footnote">일부 출처 조회 실패 '+b.fetch_errors.length+'건 · 확인한 자료 범위를 벗어나 최신이라고 단정하지 않습니다.</p>':'')+'</article><section class="card" style="margin-top:20px"><h3>나의 학습 메모</h3><p class="muted">이 메모는 현재 브라우저에만 저장됩니다. 운영 검사·공식 근거와 분리한 개인 메모입니다.</p><textarea class="notearea" id="ai-note" placeholder="확인한 사실 / 내 해석 / 실험 결과 / 다음 질문"></textarea><div class="right" style="margin-top:10px"><button id="save-note">메모 저장</button><span class="muted" id="note-status"></span></div></section>';$('#ai-date').value=b.date;$('#ai-date').onchange=e=>{selectedAI=data.ai_archive.find(x=>x.date===e.target.value);ai()};const key='api-watch-ai-note:'+b.date;try{$('#ai-note').value=localStorage.getItem(key)||''}catch(_){}$('#save-note').onclick=()=>{try{localStorage.setItem(key,$('#ai-note').value);$('#note-status').textContent='이 브라우저에 저장했습니다.'}catch(_){$('#note-status').textContent='저장 실패 · 내용을 복사해 보관하세요.'}}}
function about(){$('#view').innerHTML='<h2>검사 기준과 운영 방식</h2><div class="grid"><section class="card"><h3>실제 검사</h3><p>HTTP 응답·시간, 필수 필드·자료형, 이전 승인 구조, 데이터 시각, 건수·중복·값 범위를 검사합니다. 대상별 기준은 상세 화면에 공개합니다.</p><p>응답 실패는 첫 회 주의, 연속 2회부터 이상 감지로 표시합니다. 품질 위반은 응답이 HTTP 200이어도 별도로 기록합니다.</p><h3>정기 실행</h3><p>GitHub Actions에서 시간당 검사하고 보고서를 갱신합니다. 스케줄은 지연되거나 비활성화될 수 있어 관제 결과 자체의 갱신 시각도 표시합니다.</p><a href="https://github.com/0Ju12/data-projects/actions/workflows/api-watch.yml" target="_blank" rel="noopener">실제 실행 이력 보기 ↗</a></section><section class="card"><h3>출처와 한계</h3>'+data.targets.map(t=>'<p><a href="'+esc(t.spec.docs)+'" target="_blank" rel="noopener">'+esc(t.name)+'</a><br><small class="muted">'+esc(t.spec.description)+'</small></p>').join('')+'<p>최근 72회/대상과 이슈 200개를 보고서에 보관합니다. 짧은 관측 이력을 장기 가동률이나 장애 탐지 성능으로 확대하지 않습니다.</p><p>AI 기술 코너는 공식 메타데이터와 사전 작성 설명을 조합하며, 생성형 AI의 성능 검증이나 자동 논문 심사가 아닙니다.</p></section></div>'}
function change(next){tab=next;$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}function render(){if(!data)return;({overview,incidents,lab,ai,about}[tab]||overview)()}$$('[data-tab]').forEach(b=>b.onclick=()=>change(b.dataset.tab));$('#reload').onclick=load;if(mode==='django'){$('#run-link').textContent='지금 검사';$('#run-link').href='#';$('#run-link').onclick=async e=>{e.preventDefault();try{const token=document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';const r=await fetch('/api/run',{method:'POST',headers:{'X-CSRFToken':token},credentials:'same-origin'}),v=await r.json();if(!r.ok)throw Error(v.error||'검사 실패');data=v;render()}catch(e){$('#error').classList.remove('hidden');$('#error').textContent=e.message}}}load();
</script></body></html>
