async function lab(){if(!labData){$('#view').innerHTML='<div class="empty">합성 장애 실험 결과를 불러오는 중</div>';try{labData=await jsonFile('lab.json')}catch(e){if(tab==='lab')$('#view').innerHTML='<p class="error">'+esc(e.message)+'</p>';return}}if(tab!=='lab')return;$('#view').innerHTML='<div class="title-row"><h2>장애 실험실</h2><span class="badge">SYNTHETIC · 운영 통계에 미포함</span></div><p class="tab-summary">고정된 합성 응답을 실제 검사 엔진에 넣은 사전 실행 결과입니다. 버튼을 누른 시점에 운영 API에 장애를 일으키거나 Python 검사를 새로 실행하는 기능은 아닙니다.</p><div class="kpis">'+kpi('예상 결과와 일치',labData.passed+' / '+labData.total,'실제 검출 결과를 기대값과 비교')+kpi('실험 실행 시각',fmt(labData.executed_at),'정기 검사 때 실험도 다시 실행')+'</div><div class="case-grid">'+labData.cases.map((c,i)=>'<button class="card lab-case" data-case="'+i+'"><b>'+esc(c.name)+'</b><p>'+esc(c.expected||'오류 없음')+' → '+(c.passed?'예상대로 검출':'불일치')+'</p></button>').join('')+'</div><section id="lab-case" class="card" style="margin-top:20px"></section>';$$('[data-case]').forEach(b=>b.onclick=()=>{const c=labData.cases[+b.dataset.case];$$('[data-case]').forEach(x=>x.classList.toggle('active',x===b));$('#lab-case').innerHTML='<h2>'+esc(c.name)+'</h2><p>HTTP '+c.http_status+' · 예상 '+esc(c.expected||'오류 없음')+'</p><pre>'+esc(typeof c.payload==='string'?c.payload:JSON.stringify(c.payload,null,2))+'</pre><h3>실제 검사 엔진의 판정</h3>'+c.checks.filter(x=>!x.ok).map(x=>'<div class="list-row"><b>'+esc(x.label)+'</b><p>'+esc(x.detail)+'</p></div>').join('')+(c.detected.length?'':'<p class="healthy">오류를 검출하지 않았습니다.</p>')});$('[data-case]').click()}
function ai(){const b=selectedAI||data.ai_latest;if(!b){$('#view').innerHTML='<div class="empty">아직 작성된 일일 학습 노트가 없습니다.</div>';return}$('#view').innerHTML='<div class="title-row"><div><div class="section-index">DAILY INTELLIGENCE / 하루 한 개의 발견</div><h2>오늘의 AI 기술 1개</h2></div><select id="ai-date">'+data.ai_archive.map(x=>'<option value="'+esc(x.date)+'">'+esc(x.date)+' · '+esc(x.technology)+'</option>').join('')+'</select></div><p class="tab-summary">관심 저장소·공개 모델 메타데이터에서 하루 1개를 골라 설명합니다. 전 세계 신기술 전체를 포괄하거나 성능 순위를 판정하는 서비스는 아닙니다.</p><article class="tech"><span class="badge">'+esc(b.label)+'</span><h2>'+esc(b.title)+'</h2><p>'+esc(b.what)+'</p><div class="flow">'+b.flow.map((x,i)=>(i?'<i>→</i>':'')+'<span>'+esc(x)+'</span>').join('')+'</div><p class="footnote">개념적인 활용 흐름이며 해당 릴리스의 실제 아키텍처 변경도는 아닙니다.</p><div class="grid"><div><h3>내 프로젝트와 연결하면</h3><p>'+esc(b.why_for_you)+'</p><h3>오늘의 짧은 실습</h3><ol>'+b.exercise.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol><p>'+esc(b.exercise.output)+'</p></div><div><h3>원문에서 확인할 내용</h3>'+b.facts.map(x=>'<p><b>'+esc(x.label)+'</b><br>'+esc(x.value)+'</p>').join('')+'<p class="muted">'+esc(b.release_excerpt)+'</p><h3>해석의 한계</h3><ul>'+b.limits.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div><h3>면접·회고 질문</h3><p>'+esc(b.question)+'</p><div class="right">'+b.sources.map(s=>'<a class="button" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+' ↗</a>').join('')+'</div><p class="footnote">발표일: '+fmt(b.official_published_at)+' · 수집일: '+fmt(b.collected_at)+' · 학습일: '+esc(b.date)+'<br>'+esc(b.composition)+'</p>'+(b.fetch_errors.length?'<p class="footnote">일부 출처 조회 실패 '+b.fetch_errors.length+'건 · 확인한 자료 범위를 벗어나 최신이라고 단정하지 않습니다.</p>':'')+'</article><section class="card" style="margin-top:20px"><div class="row" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><h3>나의 학습 메모</h3><a class="button" href="https://career-workspace-0ju12.affectionateimage.chatgpt.site/lab?source='+encodeURIComponent(b.date)+'" target="_blank" rel="noopener">이 자료로 실험·학습 기록 ↗</a></div><p class="muted">이 메모는 현재 브라우저에만 저장됩니다. 운영 검사·공식 근거와 분리한 개인 메모입니다.</p><textarea class="notearea" id="ai-note" placeholder="확인한 사실 / 내 해석 / 실험 결과 / 다음 질문"></textarea><div class="right" style="margin-top:10px"><button id="save-note">메모 저장</button><button id="export-ai-notes">기존 학습 메모 내보내기</button><span class="muted" id="note-status"></span></div></section>';$('#export-ai-notes').onclick=exportAINotes;$('#ai-date').value=b.date;$('#ai-date').onchange=e=>{selectedAI=data.ai_archive.find(x=>x.date===e.target.value);ai()};const key='api-watch-ai-note:'+b.date;try{$('#ai-note').value=localStorage.getItem(key)||''}catch(_){}$('#save-note').onclick=()=>{try{localStorage.setItem(key,$('#ai-note').value);$('#note-status').textContent='이 브라우저에 저장했습니다.'}catch(_){$('#note-status').textContent='저장 실패 · 내용을 복사해 보관하세요.'}}}
function catalog(){if(!catalogData){$('#view').innerHTML='<div class="empty">목록을 읽지 못했습니다. 새로 불러오기를 눌러 다시 확인하세요.</div>';return}const entries=catalogData.entries,cats=[...new Set(entries.map(e=>e.category))].sort(),filtered=entries.filter(e=>(catalogAuth==='all'||e.auth_type===catalogAuth)&&(catalogCategory==='all'||e.category===catalogCategory)&&(!catalogQuery||(e.name+' '+e.description+' '+e.category).toLowerCase().includes(catalogQuery.toLowerCase()))),pages=Math.max(1,Math.ceil(filtered.length/24));catalogPage=Math.min(catalogPage,pages-1);$('#view').innerHTML='<div class="title-row"><div><div class="section-index">DISCOVER / 한국 · 글로벌 공개 API</div><h2>API 전체 목록</h2></div><a class="button" href="https://github.com/yybmion/public-apis-4Kr" target="_blank" rel="noopener">원본 저장소 ↗</a></div><div class="catalog-summary"><strong>'+catalogData.count.toLocaleString()+'</strong><span>API·리소스 링크</span><span>·</span><span>원문 기준 인증 없음 '+entries.filter(e=>e.auth_type==='none').length.toLocaleString()+'개</span><span>·</span><span>수집 '+fmt(catalogData.collected_at)+'</span></div><p class="tab-summary">한국·글로벌 원문 표의 전체 링크를 URL 중복 제거 후 모았습니다. 정기 검사 '+data.targets.length+'개와 별개인 탐색 목록입니다. 인증이 없다고 모든 API가 현재 동작하는 것은 아니며, 키·OAuth·이용 신청이 필요한 항목은 제공자 설정과 전용 연결 코드가 필요합니다.</p><div class="catalog-controls"><input id="catalog-search" aria-label="전체 API 검색" placeholder="이름, 설명, 주제로 전체 목록 검색" value="'+esc(catalogQuery)+'"><select id="catalog-auth" aria-label="인증 필터"><option value="all">모든 인증 방식</option><option value="none">인증 없음 · 원문 기준</option><option value="required">키·OAuth 등 인증 표기</option><option value="unknown">인증 조건 확인 필요</option></select><select id="catalog-category" aria-label="전체 목록 분야 필터"><option value="all">모든 분야</option>'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'</select></div><p class="footnote">검색 결과 '+filtered.length.toLocaleString()+'개 · '+(catalogPage*24+1)+'–'+Math.min((catalogPage+1)*24,filtered.length)+' 표시</p><div class="catalog-grid">'+filtered.slice(catalogPage*24,(catalogPage+1)*24).map(e=>'<article class="card catalog-card"><div class="catalog-top"><span>'+esc(e.category)+'</span><span>'+(e.source==='korea'?'한국 목록':'글로벌 목록')+'</span></div><h3>'+esc(e.name)+'</h3><p>'+esc(e.description)+'</p><div class="catalog-actions"><span class="catalog-pill '+(e.auth_type==='none'?'none':'')+'">'+(e.auth_type==='none'?'인증 없음 · 원문':esc(e.auth))+'</span><a href="'+esc(e.url)+'" target="_blank" rel="noopener">공식 안내 ↗</a></div></article>').join('')+'</div>'+(filtered.length?'':'<div class="empty">검색 결과가 없습니다.</div>')+'<div class="pagination"><button id="catalog-prev" '+(catalogPage===0?'disabled':'')+'>← 이전</button><span>'+(catalogPage+1)+' / '+pages+'</span><button id="catalog-next" '+(catalogPage>=pages-1?'disabled':'')+'>다음 →</button></div><p class="footnote">'+esc(catalogData.attribution)+' · MIT 라이선스 · <a href="https://github.com/0Ju12/data-projects/tree/main/api-watch/credits" target="_blank" rel="noopener">라이선스 원문</a><br>'+esc(catalogData.scope)+'</p>';$('#catalog-auth').value=catalogAuth;$('#catalog-category').value=catalogCategory;$('#catalog-search').oninput=e=>{catalogQuery=e.target.value;catalogPage=0;const pos=e.target.selectionStart;catalog();$('#catalog-search').focus();$('#catalog-search').setSelectionRange(pos,pos)};$('#catalog-auth').onchange=e=>{catalogAuth=e.target.value;catalogPage=0;catalog()};$('#catalog-category').onchange=e=>{catalogCategory=e.target.value;catalogPage=0;catalog()};$('#catalog-prev').onclick=()=>{catalogPage--;catalog();$('#view').scrollIntoView({block:'start'})};$('#catalog-next').onclick=()=>{catalogPage++;catalog();$('#view').scrollIntoView({block:'start'})}}

function exportAINotes(){try{const items=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!/^api-watch-ai-note:\d{4}-\d{2}-\d{2}$/.test(key))continue;const date=key.slice('api-watch-ai-note:'.length),text=localStorage.getItem(key);if(text)items.push({date,text,title:data.ai_archive.find(b=>b.date===date)?.title||date+' AI 학습'})}if(!items.length){$('#note-status').textContent='내보낼 기존 메모가 없습니다.';return}const blob=new Blob([JSON.stringify({schema:'api-watch-notes/v1',exported_at:new Date().toISOString(),items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='API_Watch_학습메모.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),30000);$('#note-status').textContent='개인 학습 공간의 백업·도움말에서 이 파일을 가져오세요. 기존 메모는 보존합니다.'}catch(_){$('#note-status').textContent='메모를 읽지 못했습니다. 현재 내용을 복사해 보관하세요.'}}
function about(){$('#view').innerHTML='<h2>검사 기준과 운영 방식</h2><div class="grid"><section class="card"><h3>실제 검사</h3><p>HTTP 응답·시간, 필수 필드·자료형, 이전 승인 구조, 데이터 시각, 건수·중복·값 범위를 검사합니다. 대상별 기준은 상세 화면에 공개합니다.</p><p>응답 실패는 첫 회 주의, 연속 2회부터 이상 감지로 표시합니다. 품질 위반은 응답이 HTTP 200이어도 별도로 기록합니다.</p><h3>정기 실행</h3><p>GitHub Actions에서 시간당 검사하고 보고서를 갱신합니다. 스케줄은 지연되거나 비활성화될 수 있어 관제 결과 자체의 갱신 시각도 표시합니다.</p><a href="https://github.com/0Ju12/data-projects/actions/workflows/api-watch.yml" target="_blank" rel="noopener">실제 실행 이력 보기 ↗</a></section><section class="card"><h3>출처와 한계</h3><p>일부 API는 갱신 시각이 없어 응답·구조·품질만 검사합니다. HTTP 200인 지원 종료 오류도 정상 데이터로 간주하지 않습니다. 전체 탐색 목록과 실제 정기 검사 대상은 구분합니다.</p>'+data.targets.map(t=>'<p><a href="'+esc(t.spec.docs)+'" target="_blank" rel="noopener">'+esc(t.name)+'</a><br><small class="muted">'+esc(t.spec.description)+'</small></p>').join('')+'<p>대상별 최근 72회와 이슈 200개를 보고서에 보관합니다. 짧은 관측 이력을 장기 가동률이나 장애 탐지 성능으로 확대하지 않습니다.</p><p>AI 기술 코너는 공식 메타데이터와 사전 작성 설명을 조합하며, 생성형 AI의 성능 검증이나 자동 논문 심사가 아닙니다.</p></section></div>'}
function change(next){tab=next;$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}function render(){if(!data)return;({overview,incidents,lab,ai,catalog,about}[tab]||overview)()}$$('[data-tab]').forEach(b=>b.onclick=()=>change(b.dataset.tab));$('#reload').onclick=load;if(mode==='django'){$('#run-link').textContent='지금 검사';$('#run-link').href='#';$('#run-link').onclick=async e=>{e.preventDefault();try{const token=document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';const r=await fetch('/api/run',{method:'POST',headers:{'X-CSRFToken':token},credentials:'same-origin'}),v=await r.json();if(!r.ok)throw Error(v.error||'검사 실패');data=v;render()}catch(e){$('#error').classList.remove('hidden');$('#error').textContent=e.message}}}load();
</script></body></html>
