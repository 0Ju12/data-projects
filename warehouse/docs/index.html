  --s1:#3987e5;--s1-ink:#3987e5;--s2:#d95926;--good:#0ca30c;--warn:#fab219;--crit:#e66767;--card:#1a1a19;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:19px;margin:0;letter-spacing:-.3px}.gen{font-size:12.5px;color:var(--muted)}.gen a{color:inherit}
nav{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;color:var(--text2);font:inherit;font-size:14.5px;font-weight:600;padding:8px 14px 11px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--s1)}
nav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--s1);outline-offset:-2px;border-radius:6px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
section{display:none}section.on{display:block}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;min-width:0}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
h2{font-size:15px;margin:0 0 2px;letter-spacing:-.2px}.sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.kpi b{display:block;font-size:27px;line-height:1.15;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--text2)}.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.kpi button{all:unset;cursor:pointer;display:block;width:100%}.kpi button:focus-visible{outline:2px solid var(--s1);outline-offset:6px;border-radius:8px}
.spark{display:block;width:100%;height:38px;margin-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow-x:auto;max-width:100%;background:var(--card);scrollbar-width:none}
.seg button{border:0;background:none;color:var(--text2);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.fl{font-size:12.5px;color:var(--muted)}
.chart{position:relative;width:100%}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text2);margin:0 0 8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .08s;font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip b{font-weight:700}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px;white-space:nowrap}td{padding:6px;border-top:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.w{white-space:normal}
.b{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:color-mix(in srgb,var(--good) 70%,var(--text))}
.wn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:color-mix(in srgb,var(--warn) 60%,var(--text))}
.ng{background:color-mix(in srgb,var(--crit) 16%,transparent);color:color-mix(in srgb,var(--crit) 75%,var(--text))}
.note{font-size:12.5px;color:var(--muted);line-height:1.65;margin:10px 0 0}.note a{color:inherit}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px 52px;gap:4px 10px;align-items:center;font-size:13px}
.hb .bar{height:10px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}.hb .v{text-align:right;font-variant-numeric:tabular-nums}.hb .p{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.hb .cat{color:var(--muted);font-size:11.5px;margin-left:6px}
.hb>div{min-width:0}.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details{margin-top:10px}summary{cursor:pointer;font-size:12.5px;color:var(--text2);font-weight:600}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0}
.ramp{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px}.ramp i{display:inline-block;width:22px;height:10px}
.sec{font-size:16px;margin:30px 0 12px;letter-spacing:-.2px}
.q{font-size:12px;font-weight:700;color:var(--s1-ink);margin:0 0 4px;letter-spacing:.2px}.ans{font-size:14.5px;line-height:1.65;margin:4px 0 8px}.src{font-size:11.5px;color:var(--muted)}.src code{font-size:11px}
.more{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--s1-ink)}.more:focus-visible{outline:2px solid var(--s1);outline-offset:3px;border-radius:4px}
.heat td.h{text-align:right;font-variant-numeric:tabular-nums;min-width:64px}

function scatter(host,pts,o={}){const W=720,H=o.h||300,L=54,R=14,T=12,B=30;if(!pts.length){host.innerHTML='<p class="empty">자료 없음</p>';return}
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),tx=nice(Math.min(...xs),Math.max(...xs),6),ty=nice(Math.min(...ys),Math.max(...ys)),x0=tx[0],x1=tx[tx.length-1],y0=ty[0],y1=ty[ty.length-1];
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);let g='';
  ty.forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${nf(v)}</text>`);
  tx.forEach(v=>g+=`<text x="${X(v)}" y="${H-8}" text-anchor="middle">${nf(v)}${o.xunit||''}</text>`);
  (o.marks||[]).forEach(([v,lab],k)=>g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="var(--line2)" stroke-dasharray="4 4"/><text x="${k%2?X(v)+5:X(v)-5}" y="${T+12}" text-anchor="${k%2?'start':'end'}">${esc(lab)}</text>`);
  pts.forEach((p,i)=>g+=`<circle class="pt" data-i="${i}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.4" fill="var(--s1)" fill-opacity=".5"/>`);
  if(o.fit){let d='';const fx0=Math.min(...xs),fx1=Math.max(...xs);for(let v=fx0;v<=fx1+1e-9;v+=(fx1-fx0)/120){const y=o.fit(v);if(y<y0||y>y1)continue;d+=(d?'L':'M')+X(v).toFixed(1)+','+Y(y).toFixed(1)}g+=`<path d="${d}" fill="none" stroke="var(--s2)" stroke-width="2.5"/>`}
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'')}">${g}</svg>`;
  host.querySelectorAll('.pt').forEach(c=>{c.addEventListener('pointermove',e=>showTip(e,pts[+c.dataset.i][2]));c.addEventListener('pointerleave',hideTip)})}

// 질문 6: 일사량과 한낮 수요 — 같은 달 안 맑은 날 vs 흐린 날, 해가 진 시간대는 대조군
function solarCards(g){const S=D.ana_solar,TC=D.ana_solar_terc||[],SH=D.ana_solar_hours||[];if(!S||!S.midday||!TC.length)return;

  const vs=rows.flatMap(r=>[r.c[6],r.s[6]]),t=nice(Math.min(...vs,1)-.02,Math.max(...vs)+.02),x0=t[0],x1=t[t.length-1],X=v=>L+(v-x0)/(x1-x0)*(W-L-R),rh=(H-T-B)/rows.length;
  let d='';t.forEach(v=>d+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="${v===1?'var(--line2)':'var(--grid)'}"/><text x="${X(v)}" y="${H-10}" text-anchor="middle">${nf(v,2)}</text>`);
  rows.forEach((r,i)=>{const y=T+rh*(i+.5);d+=`<text x="${L-8}" y="${y+4}" text-anchor="end">${r.m}월</text><line x1="${X(r.s[6])}" x2="${X(r.c[6])}" y1="${y}" y2="${y}" stroke="var(--line2)" stroke-width="2"/><circle cx="${X(r.c[6])}" cy="${y}" r="5" fill="var(--s1)"/><circle cx="${X(r.s[6])}" cy="${y}" r="5" fill="var(--warn)"/><rect class="hit" data-i="${i}" x="${L}" y="${y-rh/2}" width="${W-L-R}" height="${rh}" fill="transparent"/>`});
  const c1=card('c6',`<p class="q">질문 6</p><h2>같은 달, 맑은 날과 흐린 날의 한낮 수요</h2><p class="sub">달마다 평일을 한낮(11~14시) 일사량 순으로 셋으로 나눠 가장 맑은 3분의 1과 가장 흐린 3분의 1을 비교. 값은 한낮 수요 ÷ 그날 새벽 최저 (1 아래면 한낮이 새벽보다 낮음).</p><div class="lg"><span><i style="background:var(--s1)"></i>흐린 날</span><span><i style="background:var(--warn)"></i>맑은 날</span></div><div class="chart" id="ps1"></div>`);g.append(c1);
  const host=c1.querySelector('#ps1');host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 맑은 날과 흐린 날의 한낮 수요 비율">${d}</svg>`;
  host.querySelectorAll('.hit').forEach(h=>{h.addEventListener('pointermove',e=>{const r=rows[+h.dataset.i];showTip(e,`<b>${r.m}월</b> (맑은 날·흐린 날 각 ${r.s[7]}·${r.c[7]}일)<br>흐린 날: 일사량 ${nf(r.c[2])} W/m² · 비율 ${nf(r.c[6],3)}<br>맑은 날: 일사량 ${nf(r.s[2])} W/m² · 비율 ${nf(r.s[6],3)}<br>한낮 기온 ${nf(r.c[4],1)}℃ → ${nf(r.s[4],1)}℃`)});h.addEventListener('pointerleave',hideTip)});
  const sea=['winter','spring','summer','autumn'].filter(k=>S.seasons&&S.seasons[k]),spring=SH.filter(r=>r[0]==='spring'),ser=['흐림','맑음'].map(l=>({name:l==='흐림'?'흐린 날':'맑은 날',color:l==='흐림'?'var(--s1)':'var(--warn)',pts:spring.filter(r=>r[1]===l).map(r=>[r[2],r[3]])}));
  const c2=card('c6',`<p class="q">질문 6 · 확인</p><h2>일사량 100 W/m²마다 한낮 수요 ${nf(M.mw_per_100w)} MW</h2><p class="sub">같은 달끼리 비교(달별 절편)하고, 그날의 기본 수요(새벽 최저)와 냉난방(한낮 기온이 ${nf(S.cool_above,0)}℃ 위·${nf(S.heat_below,0)}℃ 아래)을 함께 넣은 회귀. 평일 ${M.days}일 · 95% 구간 ${nf(M.ci95[0])}~${nf(M.ci95[1])} MW · R² ${nf(M.r2,2)}</p>
    <div class="sc"><table><tr><th>대상</th><th class="n">100 W/m²당</th><th class="n">95% 구간</th></tr><tr><td>한낮 11~14시</td><td class="n"><b>${nf(M.mw_per_100w)} MW</b></td><td class="n">${nf(M.ci95[0])} ~ ${nf(M.ci95[1])}</td></tr>${E?`<tr><td>20~23시 (대조군)</td><td class="n">${E.mw_per_100w>0?'+':''}${nf(E.mw_per_100w)} MW</td><td class="n">${nf(E.ci95[0])} ~ ${nf(E.ci95[1])}</td></tr>`:''}${sea.map(k=>`<tr><td>${SN[k]}만 (${S.seasons[k].days}일)</td><td class="n">${nf(S.seasons[k].mw_per_100w)} MW</td><td class="n">${nf(S.seasons[k].ci95[0])} ~ ${nf(S.seasons[k].ci95[1])}</td></tr>`).join('')}</table></div>
    ${ser[0].pts.length?`<h2 style="margin-top:14px;font-size:15px">봄 평일 하루 수요 — 맑은 날과 흐린 날</h2><div class="lg">${ser.map(x=>`<span><i style="background:${x.color}"></i>${x.name}</span>`).join('')}</div><div class="chart" id="ps2"></div>`:''}
    <p class="note">해가 진 시간대에는 계수가 0 근처라, '흐린 날은 원래 수요가 많다'는 설명으로는 한낮 차이를 설명하기 어렵습니다. 그래서 전력거래소가 계량하지 않는 태양광(자가용·소규모)이 맑은 날 한낮 수요를 깎는다는 가설과 맞습니다. 다만 흐린 날 낮에 조명을 더 켜는 효과는 같은 시간대에 겹쳐 떼어 내지 못했고, 일사량은 네 도시의 수평면 값이라 실제 패널 각도·위치와 다릅니다. 겨울 계수가 큰 것도 낮은 해에서 기울어진 패널이 수평면보다 빛을 더 받기 때문일 수 있지만 확인하지 않았습니다.</p>`);g.append(c2);
  if(ser[0].pts.length)line(c2.querySelector('#ps2'),ser,{h:220,label:'봄 평일 맑은 날과 흐린 날의 시간대별 수요',xfmt:hh,tip:i=>`<b>${hh(ser[0].pts[i][0])}대</b><br>`+ser.map(x=>`${x.name} ${nf(x.pts[i][1])} MW`).join('<br>')+`<br>차이 ${nf(ser[0].pts[i][1]-ser[1].pts[i][1])} MW`})}

    const JD=D.jobs_daily||[];const c2=card('c5',`<h2>하루에 게시된 공고</h2><p class="sub">최근 45일, 출처별</p><div class="lg"><span><i style="background:var(--s1)"></i>Arbeitnow</span><span><i style="background:var(--s2)"></i>Remote OK</span></div><div class="chart" id="j2"></div>`);g.append(c2);

function pwrRaw(){const g=$('#pwr-g'),DD=D.demand_daily,HM=D.demand_heat;if(!DD){g.innerHTML='<p class="empty">전력 자료가 없습니다.</p>';return}

  g.append(K(nf(mx[1])+' MW','연중 최대 수요',mx[0]),K(nf(mn[3])+' MW','연중 최저 수요',mn[0]),K(nf(DD.length*24),'시간별 행','하루 24행 · 빠진 시간 없음(테스트로 확인)'));

  line(c.querySelector('#p1'),[{name:'최대',color:'var(--s1)',pts:DD.map(r=>[r[0],r[1]])},{name:'평균',color:'var(--s2)',pts:DD.map(r=>[r[0],r[2]])},{name:'최저',color:'var(--line2)',pts:DD.map(r=>[r[0],r[3]])}],{h:260,label:'하루 최대·평균·최저 수요',xfmt:s=>(+s.slice(5,7))+'월',tip:i=>`<b>${DD[i][0]}${DD[i][4]?' (주말)':''}</b><br>최대 ${nf(DD[i][1])} MW<br>평균 ${nf(DD[i][2])} MW<br>최저 ${nf(DD[i][3])} MW<br>평균 기온 ${nf(DD[i][5],1)}℃`});
  if(HM&&HM.length){const v=HM.map(r=>r[2]),lo=Math.min(...v),hi=Math.max(...v),cw=26,chh=20,L=34,T=18,W=L+24*cw+4,Hh=T+12*chh+4;let s='';
    for(let h=1;h<=24;h++)if(h%3===0||h===1)s+=`<text x="${L+(h-.5)*cw}" y="12" text-anchor="middle">${h}시</text>`;
    for(let m=1;m<=12;m++)s+=`<text x="${L-6}" y="${T+(m-.5)*chh+4}" text-anchor="end">${m}월</text>`;
    HM.forEach(r=>{const q=Math.min(6,Math.floor((r[2]-lo)/(hi-lo||1)*7));s+=`<rect class="hc" data-m="${r[0]}" data-h="${r[1]}" data-v="${r[2]}" x="${L+(r[1]-1)*cw+1}" y="${T+(r[0]-1)*chh+1}" width="${cw-2}" height="${chh-2}" rx="3" fill="var(--q${q})"/>`});
    const c2=card('c8',`<h2>월 × 시간대 평균 수요</h2><p class="sub">'N시'는 그 시각에 끝나는 한 시간입니다. 색이 진할수록 수요가 높습니다.</p><div class="chart sc"><svg viewBox="0 0 ${W} ${Hh}" style="min-width:560px" role="img" aria-label="월과 시간대별 평균 수요">${s}</svg></div><div class="ramp"><span>${nf(lo)} MW</span>${[0,1,2,3,4,5,6].map(i=>`<i style="background:var(--q${i})"></i>`).join('')}<span>${nf(hi)} MW</span></div>`);g.append(c2);
    c2.querySelectorAll('.hc').forEach(r=>{r.addEventListener('pointermove',e=>showTip(e,`<b>${r.dataset.m}월 · ${r.dataset.h-1}~${r.dataset.h}시</b><br>평균 ${nf(r.dataset.v)} MW`));r.addEventListener('pointerleave',hideTip)})}
  const SS=D.demand_season||[],nm={winter:'겨울',spring:'봄',summer:'여름',autumn:'가을'},ord=['winter','spring','summer','autumn'];
  g.append(card('c4',`<h2>계절·요일별 평균</h2><p class="sub">하루 최대 수요의 평균과 부하율(평균 ÷ 최대)</p><div class="sc"><table><tr><th>계절</th><th></th><th class="n">최대 평균</th><th class="n">부하율</th></tr>${ord.flatMap(s=>SS.filter(r=>r[0]===s)).map(r=>`<tr><td>${nm[r[0]]}</td><td>${r[1]?'주말':'평일'}</td><td class="n">${nf(r[2])}</td><td class="n">${nf(r[3],3)}</td></tr>`).join('')}</table></div>`));

// ================= 지진
function eq(){const g=$('#eq-g'),Q=D.quakes_monthly,T=D.quake_total;if(!Q){g.innerHTML='<p class="empty">지진 자료가 없습니다.</p>';return}

  const RG=D.quake_regions||[],mx=Math.max(...RG.map(r=>r[1]),1);
  g.append(card('c4',`<h2>지역별</h2><p class="sub">USGS 장소 설명의 나라·해역 기준</p><div class="hb" style="grid-template-columns:minmax(80px,120px) 1fr 52px">${RG.map(r=>`<div class="nm" title="${esc(r[0])}">${esc(r[0])}</div><div><div class="bar" style="width:${r[1]/mx*100}%"></div></div><div class="v">${nf(r[1])}</div>`).join('')}</div>`));
  const DE=D.dis_events||[];if(DE.length){const LC={Red:'var(--crit)',Orange:'var(--warn)',Green:'var(--good)'},LN={Red:'빨강',Orange:'주황',Green:'초록'},lv=l=>`<span class="lvl"><i style="background:${LC[l]}"></i>${LN[l]||esc(l)}</span>`;
    const cnt=k=>DE.filter(r=>r[4]===k).length,act=DE.filter(r=>r[11]).length;
    g.append(card('c12',`<h2>그 밖의 자연재해 경보 — 태풍·홍수·화산·가뭄</h2><p class="sub">최근 90일에 시작했거나 진행 중인 사건 ${nf(DE.length)}건 · 빨강 ${cnt('Red')} · 주황 ${cnt('Orange')} · 초록 ${cnt('Green')} · 지금 진행 중 ${act}건. 점에 마우스를 올리면 사건이 나옵니다.</p><div class="chart" id="e2"></div><div class="lg" style="margin-top:8px">${['Red','Orange','Green'].map(l=>`<span>${lv(l)}</span>`).join('')}<span style="color:var(--muted)">점 크기 = 지속 일수</span></div>`));
    const W=720,H=330,X=x=>(x+180)/360*W,Y=y=>(90-y)/180*H;let sv='';for(let x=-180;x<=180;x+=60)sv+=`<line x1="${X(x)}" x2="${X(x)}" y1="0" y2="${H}" stroke="var(--grid)"/>`;for(let y=-60;y<=60;y+=30)sv+=`<line x1="0" x2="${W}" y1="${Y(y)}" y2="${Y(y)}" stroke="${y===0?'var(--line2)':'var(--grid)'}"/><text x="4" y="${Y(y)-3}">${y}°</text>`;
    DE.slice().sort((a,b)=>a[5]-b[5]).forEach((r,i)=>{if(r[12]==null)return;const rad=Math.max(4,Math.min(13,3+Math.sqrt(r[10])));sv+=`<circle class="ev" data-k="${esc(r[0])}" cx="${X(r[12])}" cy="${Y(r[13])}" r="${rad}" fill="${LC[r[4]]}" fill-opacity="${r[5]>1?.85:.5}" stroke="var(--surface)" stroke-width="2"/>`});
    $('#e2').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="재해 사건 위치 (경도·위도)">${sv}</svg>`;const by=Object.fromEntries(DE.map(r=>[r[0],r]));
    document.querySelectorAll('#e2 .ev').forEach(c=>{c.addEventListener('pointermove',e=>{const r=by[c.dataset.k];showTip(e,`<b>${esc(r[2])}</b><br>${esc(r[1])} · ${LN[r[4]]} 경보<br>${r[8]} ~ ${r[9]} (${r[10]}일)${r[6]!=null?`<br>규모 ${nf(r[6],1)} ${esc(r[7]||'')}`:''}`)});c.addEventListener('pointerleave',hideTip)});

    const CH=D.dis_changes||[];g.append(card('c5',`<h2>경보 등급이 바뀐 사건</h2><p class="sub">수집을 시작한 뒤에 등급이 오르내린 기록</p>${CH.length?`<div class="sc"><table><tr><th>사건</th><th>변화</th><th>날짜</th></tr>${CH.map(r=>`<tr><td class="w">${esc(r[1])}</td><td>${lv(r[2])} → ${lv(r[3])}</td><td>${r[4]}</td></tr>`).join('')}</table></div>`:'<p class="empty">아직 등급이 바뀐 사건이 없습니다. 수집을 막 시작해 이력이 쌓이는 중입니다.</p>'}`))}

// ================= 품질
function qa(){const g=$('#qa-g'),T=D.tests||[],H=D.history||[];
