version: 2
models:
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  - name: fct_demand_hourly
    description: "한 행 = 한 시간. 키는 그 시간의 시작 시각(KST)"
    columns:
      - name: hour_start_kst
        description: "그 한 시간의 시작 시각. 원본의 '24시' 는 그날 23:00"
        data_tests: [unique, not_null]
      - name: demand_date
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - name: demand_mw
        data_tests:
          - not_null
          - accepted_range: {arguments: {min_value: 20000, max_value: 120000}}
      - name: temp_mean
        data_tests: [not_null]
  - name: fct_demand_daily
    description: "한 행 = 하루. 최대·최소·평균 수요와 부하율"
    columns:
      - name: demand_date
        data_tests: [unique, not_null]
      - name: peak_hour_ending
        description: "최대 수요가 난 시간대의 끝 시각 (18 = 17:00~18:00)"
      - name: load_factor
        description: "평균 수요 ÷ 최대 수요. 1 에 가까울수록 하루 수요가 평평함"
        data_tests: [{accepted_range: {arguments: {min_value: 0.5, max_value: 1}}}]
  - name: dim_region
    columns:
      - name: region
        data_tests: [unique, not_null]
  - name: fct_quakes_monthly
    description: "한 행 = (월, 지역). 증분 모델 — 새로 들어오거나 고쳐진 지진이 속한 묶음만 다시 계산"
    columns:
      - name: month_kst
        description: "그 달의 1일 (한국 시간 기준)"
        data_tests: [not_null]
      - name: region
        description: "USGS 장소 설명의 마지막 쉼표 뒤 (나라·해역)"
        data_tests: [{relationships: {arguments: {to: ref('dim_region'), field: region}}}]
      - name: quakes
        description: "그 달 그 지역의 지진 수"
        data_tests: [{accepted_range: {arguments: {min_value: 1}}}]
      - name: max_mag
        description: "그 묶음의 최대 규모"
      - name: last_updated_at
        description: "묶음 안 지진의 가장 늦은 수정 시각 — 다음 증분 실행의 기준선"
        data_tests: [not_null]
  - name: dim_skill
    description: "기술 차원 — 사전에 있는 이름·분류"
    columns:
      - name: skill
        data_tests: [unique, not_null]
      - name: category
        data_tests: [{accepted_values: {arguments: {values: ["language", "frontend", "backend", "cloud", "infra", "data", "analytics", "enterprise", "ai", "role"]}}}]
  - name: fct_job_postings
    description: "한 행 = 공고 한 건"
    columns:
      - name: job_key
        data_tests: [unique, not_null]
      - name: salary_quality
        description: "급여 칸의 상태: none(없음) · annual(연봉으로 볼 수 있음) · suspect_low/high/order(단위나 순서가 이상해 쓰지 않음)"
        data_tests: [{accepted_values: {arguments: {values: ["none", "annual", "suspect_low", "suspect_high", "suspect_order"]}}}]
      - name: salary_mid_usd
        description: "연봉으로 볼 수 있는 공고(salary_quality = annual)의 범위 가운데 값, 달러. 나머지는 비움"
        data_tests: [{accepted_range: {arguments: {min_value: 10000, max_value: 1000000}}}]
      - name: skill_count
        data_tests: [{accepted_range: {arguments: {min_value: 0, max_value: 30}}}]
  - name: fct_skill_demand_weekly
    description: "주 × 기술. share_of_tech = 그 주 기술 공고 가운데 이 기술을 언급한 비율"
    columns:
      - name: skill
        data_tests: [{relationships: {arguments: {to: ref('dim_skill'), field: skill}}}]
      - name: share_of_tech
        data_tests: [{accepted_range: {arguments: {min_value: 0, max_value: 1}}}]
  - name: fct_jobs_daily
    columns:
      - name: postings
        data_tests: [{accepted_range: {arguments: {min_value: 1}}}]
  - name: dim_asset
    columns:
      - name: asset
        data_tests: [unique, not_null]
  - name: fct_krw_premium_daily
    description: "일 × 자산. 업비트 원화 종가가 코인베이스 달러 종가(원화 환산)보다 몇 % 비싼가"
    columns:
      - name: asset
        data_tests: [{relationships: {arguments: {to: ref('dim_asset'), field: asset}}}]
      - name: usdkrw
        data_tests: [{accepted_range: {arguments: {min_value: 800, max_value: 2500}}}]
      - name: premium_pct
        description: "(업비트 원화 종가 ÷ 코인베이스 종가의 원화 환산 − 1) × 100"
        data_tests: [not_null, {accepted_range: {arguments: {min_value: -30, max_value: 60}}}]
      - name: fx_stale_days
        description: "환산에 쓴 환율이 며칠 전 고시값인가 (주말 1~2, 연휴 최대 며칠)"
        data_tests: [{accepted_range: {arguments: {min_value: 0, max_value: 6}}}]
  - name: fct_premium_monthly
    columns:
      - name: days
        data_tests: [{accepted_range: {arguments: {min_value: 1, max_value: 31}}}]
