name: warehouse
version: "1.0"
profile: warehouse
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target"]

# 원본 위치 — 같은 저장소의 다른 프로젝트가 매일 갱신하는 파일을 그대로 읽습니다 (복사하지 않음)
vars:
  quakes_csv: "../geo-data-pipeline/data/events.csv"
  demand_csv: "../power-demand/data/kpx_hourly_demand_2025.csv"
  weather_csv: "../power-demand/data/weather_2025.csv"
  jobs_csv: "data/jobs.csv"
  jobs_fetch_csv: "data/jobs_fetch_log.csv"
  quake_fresh_days: 14        # 지진 목록이 이 일수보다 오래 멈춰 있으면 경고

models:
  warehouse:
    staging:      {+materialized: view}
    intermediate: {+materialized: view}
    marts:        {+materialized: table}

seeds:
  warehouse:
    skills:
      +column_types: {skill: varchar, category: varchar, scope: varchar, pattern: varchar}
