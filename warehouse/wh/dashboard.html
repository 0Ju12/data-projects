<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>웨어하우스 대시보드</title>
<style>
:root{color-scheme:light;--bg:#f4f4f2;--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#7a7873;--line:#e4e2dc;--grid:#ebe9e3;--line2:#b9b6ae;
  --s1:#2a78d6;--s2:#eb6834;--good:#0ca30c;--warn:#b97700;--crit:#d03b3b;--card:#fcfcfb;
  --q0:#cde2fb;--q1:#9ec5f4;--q2:#6da7ec;--q3:#3987e5;--q4:#256abf;--q5:#184f95;--q6:#0d366b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111110;--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--muted:#96948c;--line:#2e2e2b;--grid:#262624;--line2:#5a5852;
  --s1:#3987e5;--s2:#d95926;--good:#0ca30c;--warn:#fab219;--crit:#e66767;--card:#1a1a19;
  --q0:#0d366b;--q1:#184f95;--q2:#256abf;--q3:#3987e5;--q4:#6da7ec;--q5:#9ec5f4;--q6:#cde2fb}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--muted:#96948c;--line:#2e2e2b;--grid:#262624;--line2:#5a5852;
  --s1:#3987e5;--s2:#d95926;--good:#0ca30c;--warn:#fab219;--crit:#e66767;--card:#1a1a19;
  --q0:#0d366b;--q1:#184f95;--q2:#256abf;--q3:#3987e5;--q4:#6da7ec;--q5:#9ec5f4;--q6:#cde2fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:14px 16px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:19px;margin:0;letter-spacing:-.3px}.gen{font-size:12.5px;color:var(--muted)}.gen a{color:inherit}
nav{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;color:var(--text2);font:inherit;font-size:14.5px;font-weight:600;padding:8px 14px 11px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--s1)}
nav button:focus-visible,.seg button:focus-visible{outline:2px solid var(--s1);outline-offset:-2px;border-radius:6px}
main{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
section{display:none}section.on{display:block}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;min-width:0}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
h2{font-size:15px;margin:0 0 2px;letter-spacing:-.2px}.sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.kpi b{display:block;font-size:27px;line-height:1.15;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--text2)}.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.kpi button{all:unset;cursor:pointer;display:block;width:100%}.kpi button:focus-visible{outline:2px solid var(--s1);outline-offset:6px;border-radius:8px}
.spark{display:block;width:100%;height:38px;margin-top:8px}
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow-x:auto;max-width:100%;background:var(--card);scrollbar-width:none}
.seg button{border:0;background:none;color:var(--text2);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.fl{font-size:12.5px;color:var(--muted)}
.chart{position:relative;width:100%}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--text2);margin:0 0 8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .08s;font-variant-numeric:tabular-nums;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip b{font-weight:700}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px;white-space:nowrap}td{padding:6px;border-top:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.w{white-space:normal}
.b{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:color-mix(in srgb,var(--good) 70%,var(--text))}
.wn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:color-mix(in srgb,var(--warn) 60%,var(--text))}
.ng{background:color-mix(in srgb,var(--crit) 16%,transparent);color:color-mix(in srgb,var(--crit) 75%,var(--text))}
.note{font-size:12.5px;color:var(--muted);line-height:1.65;margin:10px 0 0}.note a{color:inherit}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px 52px;gap:4px 10px;align-items:center;font-size:13px}
.hb .bar{height:10px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}.hb .v{text-align:right;font-variant-numeric:tabular-nums}.hb .p{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.hb .cat{color:var(--muted);font-size:11.5px;margin-left:6px}
.hb>div{min-width:0}.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details{margin-top:10px}summary{cursor:pointer;font-size:12.5px;color:var(--text2);font-weight:600}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0}
.ramp{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px}.ramp i{display:inline-block;width:22px;height:10px}
@media (max-width:900px){.c3{grid-column:span 6}.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:520px){.kpi b{font-size:22px}.hb{grid-template-columns:minmax(80px,120px) 1fr 38px 46px}}
</style></head><body>
<header><div class="hd"><h1>웨어하우스 대시보드</h1><span class="gen" id="gen"></span></div>
<nav role="tablist" aria-label="화면">
<button role="tab" data-t="home" aria-selected="true">개요</button><button role="tab" data-t="mkt" aria-selected="false">시세·환율</button><button role="tab" data-t="jobs" aria-selected="false">채용</button><button role="tab" data-t="pwr" aria-selected="false">전력</button><button role="tab" data-t="eq" aria-selected="false">지진</button><button role="tab" data-t="qa" aria-selected="false">품질</button>
</nav></header>
<main>
<section id="home" class="on"><div class="grid" id="home-g"></div></section>
<section id="mkt"><div class="filters"><span class="fl">자산</span><span class="seg" id="f-asset"></span><span class="fl">기간</span><span class="seg" id="f-range"></span></div><div class="grid" id="mkt-g"></div></section>
<section id="jobs"><div class="filters"><span class="fl">분류</span><span class="seg" id="f-cat"></span></div><div class="grid" id="jobs-g"></div></section>
<section id="pwr"><div class="grid" id="pwr-g"></div></section>
<section id="eq"><div class="grid" id="eq-g"></div></section>
<section id="qa"><div class="grid" id="qa-g"></div></section>
</main><div id="tip" role="status"></div>
<script>
const D=__DATA__;
const $=s=>document.querySelector(s),el=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(v,d=0)=>v==null?'–':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d});
const md=s=>{const [y,m,d]=s.split('-');return (+m)+'/'+(+d)},ym=s=>s.slice(2,4)+'.'+(+s.slice(5,7));
const tip=$('#tip');
function showTip(e,h){tip.innerHTML=h;tip.style.opacity=1;const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}
const hideTip=()=>tip.style.opacity=0;
const nice=(lo,hi,n=4)=>{if(lo===hi){lo-=1;hi+=1}const st=Math.pow(10,Math.floor(Math.log10((hi-lo)/n)));const k=[1,2,2.5,5,10].find(k=>(hi-lo)/(k*st)<=n+1)*st;const a=Math.floor(lo/k)*k,b=Math.ceil(hi/k)*k,t=[];for(let v=a;v<=b+k/2;v+=k)t.push(+v.toFixed(10));return t};
// ---- 꺾은선: series=[{name,color,pts:[[label,y,extra]]}] (x 는 순서). 가로 기준선·십자선·말풍선
function line(host,series,o={}){const W=720,H=o.h||250,L=46,R=12,T=10,B=24,n=series[0].pts.length;if(!n){host.innerHTML='<p class="empty">자료 없음</p>';return}
  const ys=series.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>v!=null),t=nice(Math.min(...ys,o.zero?0:Infinity),Math.max(...ys,o.zero?0:-Infinity)),y0=t[0],y1=t[t.length-1];
  const X=i=>L+(n<2?0:i/(n-1))*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let g='';t.forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===0&&o.zero?'var(--line2)':'var(--grid)'}" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${nf(v,o.dec??0)}${o.unit||''}</text>`);
  const step=Math.max(1,Math.ceil(n/6));for(let i=0;i<n;i+=step)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?'start':'middle'}">${esc((o.xfmt||md)(series[0].pts[i][0]))}</text>`;
  series.forEach(s=>{let d='',pen=false;s.pts.forEach((p,i)=>{if(p[1]==null){pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(p[1]).toFixed(1);pen=true});g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`});
  if(o.endLabel)series.forEach(s=>{const p=s.pts[n-1];if(p[1]!=null)g+=`<circle cx="${X(n-1)}" cy="${Y(p[1])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'')}">${g}<line class="ch" y1="${T}" y2="${H-B}" stroke="var(--line2)" stroke-width="1" opacity="0"/>${series.map(s=>`<circle class="dot" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`).join('')}<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`;
  const svg=host.firstChild,ch=svg.querySelector('.ch'),dots=[...svg.querySelectorAll('.dot')];
  const mv=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,i=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));ch.setAttribute('x1',X(i));ch.setAttribute('x2',X(i));ch.setAttribute('opacity',1);
    dots.forEach((c,k)=>{const v=series[k].pts[i][1];if(v==null){c.setAttribute('opacity',0);return}c.setAttribute('cx',X(i));c.setAttribute('cy',Y(v));c.setAttribute('opacity',1)});
    showTip(e,(o.tip||((i,ss)=>`<b>${esc(ss[0].pts[i][0])}</b><br>`+ss.map(s=>`${esc(s.name)} ${nf(s.pts[i][1],o.dec??0)}${o.unit||''}`).join('<br>')))(i,series))};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerleave',()=>{hideTip();ch.setAttribute('opacity',0);dots.forEach(c=>c.setAttribute('opacity',0))})}
// ---- 세로 막대(쌓기 가능): rows=[[label,v1,v2..]]
function bars(host,rows,cols,o={}){const W=720,H=o.h||230,L=46,R=8,T=10,B=24,n=rows.length;if(!n){host.innerHTML='<p class="empty">자료 없음</p>';return}
  const tot=rows.map(r=>cols.reduce((a,c,k)=>a+(r[k+1]||0),0)),t=nice(0,Math.max(...tot,1)),y1=t[t.length-1],Y=v=>T+(1-v/y1)*(H-T-B),bw=(W-L-R)/n,w=Math.max(2,Math.min(26,bw-2));
  let g='';t.forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${nf(v)}</text>`);
  const step=Math.max(1,Math.ceil(n/8));
  rows.forEach((r,i)=>{const x=L+i*bw+(bw-w)/2;let acc=0;cols.forEach((c,k)=>{const v=r[k+1]||0;if(!v)return;const yb=Y(acc),yt=Y(acc+v),top=k===cols.length-1||!cols.slice(k+1).some((_,j)=>r[k+2+j]);const h=Math.max(1,yb-yt-(acc?2:0));
      g+=top?`<path d="M${x},${yt+h} v${-(h-Math.min(4,h))} q0,${-Math.min(4,h)} ${Math.min(4,w/2)},${-Math.min(4,h)} h${w-2*Math.min(4,w/2)} q${Math.min(4,w/2)},0 ${Math.min(4,w/2)},${Math.min(4,h)} v${h-Math.min(4,h)}z" fill="${c.color}"/>`:`<rect x="${x}" y="${yt}" width="${w}" height="${h}" fill="${c.color}"/>`;acc+=v});
    if(i%step===0)g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc((o.xfmt||md)(r[0]))}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>`});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'')}">${g}</svg>`;
  host.querySelectorAll('.hit').forEach(h=>{h.addEventListener('pointermove',e=>{const r=rows[+h.dataset.i];showTip(e,(o.tip||(r=>`<b>${esc(r[0])}</b><br>`+cols.map((c,k)=>`${esc(c.name)} ${nf(r[k+1]||0)}`).join('<br>')))(r))});h.addEventListener('pointerleave',hideTip)})}
function spark(vals,color){const v=vals.filter(x=>x!=null);if(v.length<2)return'';const lo=Math.min(...v),hi=Math.max(...v),W=200,H=38,p=vals.map((y,i)=>y==null?null:[i/(vals.length-1)*W,3+(1-(y-lo)/((hi-lo)||1))*(H-6)]).filter(Boolean);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join('')}" fill="none" stroke="${color||'var(--s1)'}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
const seg=(host,items,cur,fn)=>{host.innerHTML=items.map(([v,l])=>`<button type="button" data-v="${esc(v)}" aria-pressed="${v===cur}">${esc(l)}</button>`).join('');host.onclick=e=>{const b=e.target.closest('button');if(!b)return;host.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.v)}};
const badge=s=>{const m={pass:['ok','✓ 통과'],success:['ok','✓ 성공'],warn:['wn','! 경고'],fail:['ng','✕ 실패'],error:['ng','✕ 오류'],failed:['ng','✕ 실패']}[s]||['wn',esc(s)];return `<span class="b ${m[0]}">${m[1]}</span>`};
const card=(cls,h)=>el(`<div class="card ${cls}">${h}</div>`);
const go=t=>document.querySelector(`nav button[data-t=${t}]`).click();

// ================= 개요
function home(){const g=$('#home-g'),T=D.tests||[],pass=T.filter(t=>t[1]==='pass').length,warn=T.filter(t=>t[1]==='warn').length,H=D.history||[],ok=H.filter(h=>h.status==='success').length,last=H[H.length-1]||{};
  const k=(cls,big,lab,sm,t,sp)=>card('kpi '+cls,`<button type="button" ${t?`data-go="${t}" aria-label="${esc(lab)} 자세히"`:'tabindex="-1"'}><span>${lab}</span><b>${big}</b><small>${sm||''}</small>${sp||''}</button>`);
  g.append(k('c3',D.models??'–','모델·변경 이력','원본 → 정제 → 집계','qa'),
    k('c3',`${pass} / ${T.length}`,'품질 테스트 통과',warn?`경고 ${warn}건`:(T.length-pass?`실패 ${T.length-pass}건`:'모두 통과'),'qa'),
    k('c3',`${ok} / ${H.length}`,'기록된 매일 실행 중 성공',last.logical_date?`마지막 ${last.logical_date} · ${last.seconds}초`:'아직 기록 없음','qa'),
    k('c3',nf((+last.rows_quakes||0)+(+last.rows_demand_hourly||0)+(+last.rows_jobs||0)+(+last.rows_candles||0)),'정리된 원본 행','지진·수요·공고·일봉 합계','qa'));
  const P=D.premium&&D.premium.BTC;if(P&&P.length){const l=P[P.length-1],v=P.slice(-90).map(r=>r[1]);g.append(k('c3',`${l[1]>0?'+':''}${nf(l[1],2)}%`,'비트코인 원화 프리미엄',`${l[0]} · 최근 90일 ${nf(Math.min(...v),1)}% ~ ${nf(Math.max(...v),1)}%`,'mkt',spark(v)))}
  const F=D.fx;if(F&&F.length){const l=F[F.length-1],v=F.slice(-90).map(r=>r[1]);g.append(k('c3',nf(l[1],1)+'원','달러 환율 (기준환율)',`${l[0]} 고시`,'mkt',spark(v)))}
  const S=(D.skills||[]).filter(s=>s[1]!=='role');if(S.length){g.append(k('c3',esc(S[0][0]),'공고에서 가장 많이 언급된 기술',`최근 4주 기술 공고의 ${S[0][3]}% · 다음 ${esc(S[1]?.[0]||'')}`,'jobs',spark((D.jobs_daily||[]).map(r=>r[3]))))}
  const Q=D.quakes_monthly;if(Q&&Q.length){const l=Q[Q.length-1];g.append(k('c3',nf(l[1])+'건',`지진 (${ym(l[0])}월, 진행 중)`,`그달 최대 규모 ${nf(l[2],1)}`,'eq',spark(Q.slice(-24).map(r=>r[1]))))}
  const DD=D.demand_daily;if(DD&&DD.length){const mx=DD.reduce((a,b)=>b[1]>a[1]?b:a);const c=card('c8',`<h2>2025년 하루 최대 전력 수요</h2><p class="sub">가장 높았던 날은 ${mx[0]} (${nf(mx[1])} MW). 여름과 겨울에 솟고 봄·가을에 낮습니다.</p><div class="chart" id="h-pwr"></div>`);g.append(c);
    line(c.querySelector('#h-pwr'),[{name:'최대 수요',color:'var(--s1)',pts:DD.map(r=>[r[0],r[1]])}],{h:210,unit:'',label:'하루 최대 전력 수요',tip:(i,s)=>`<b>${DD[i][0]}${DD[i][4]?' (주말)':''}</b><br>최대 ${nf(DD[i][1])} MW<br>평균 ${nf(DD[i][2])} MW<br>평균 기온 ${nf(DD[i][5],1)}℃`})}
