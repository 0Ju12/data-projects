name: API Watch — hourly data checks and daily AI note
on:
  schedule: [{cron: '43 * * * *'}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['api-watch/**', '.github/workflows/api-watch.yml']
permissions:
  contents: write
  pages: write
  actions: read
  id-token: write
concurrency:
  group: api-watch-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs: {site: '${{ steps.site.outputs.ok }}'}
    defaults: {run: {working-directory: api-watch}}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python manage.py test tests && python manage.py check
      - run: node --test personal-workspace/lab.test.mjs personal-workspace/client.test.mjs personal-workspace/prep-backup.test.mjs
      - run: python manage.py migrate --noinput
      - name: Check live endpoints and prepare one AI note per Seoul date
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          python manage.py sync_catalog || echo 'Catalog refresh unavailable; retaining last collected catalog.'
          python manage.py sync_portfolio || echo 'Portfolio refresh unavailable; retaining last collected metadata.'
          python manage.py monitor
      - name: Save measured history and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/report.json public/workspace.json public/portfolio.json public/lab.json public/catalog.json state/checkpoint.json
          git diff --cached --quiet || git commit -m "api-watch: measured checks and daily learning note"
          git pull --rebase origin main
          git push
      - uses: actions/checkout@v4
        with: {repository: 0Ju12/gravmag-wcf, path: _wcf}
      - name: Start from the last full site and refresh only API Watch
        # geo daily builds the whole Pages site (maps, /near/, /tiles/, /status/ ...). Rebuilding it here
        # dropped those sections every hour, so reuse geo daily's last published artifact instead.
        id: site
        working-directory: .
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w geo-daily.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ] || ! gh run download "$run" -R "$GITHUB_REPOSITORY" -n github-pages -D _prev; then
            echo "No recent full site to build on; skipping deploy (the next geo daily run publishes this report)."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p _pages && tar -xf _prev/artifact.tar -C _pages
          test -f _pages/index.html
          rm -rf _pages/api-watch && cp -r api-watch/public _pages/api-watch
          test -s _pages/api-watch/report.json
          test -s _pages/api-watch/index.html
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.ok == 'true'
        with: {path: _pages}
  deploy:
    needs: monitor
    if: needs.monitor.outputs.site == 'true'
    runs-on: ubuntu-latest
    concurrency: {group: pages-deployment, cancel-in-progress: false}
    environment:
      name: github-pages
      url: '${{ steps.d.outputs.page_url }}'
    steps:
      - id: d
        uses: actions/deploy-pages@v4
