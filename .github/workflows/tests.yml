name: tests
on: [push, pull_request]
jobs:
  lint:                  # 파이썬 서식·린트(ruff.toml)와 JS 서식(.prettierrc.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q ruff==0.16.9
      - run: ruff format --check .
      - run: ruff check .
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npx -y prettier@3.10.1 --check "**/*.{js,mjs,cjs}"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: api-watch,         deps: "-r requirements.lock" }
          - { dir: geo-data-pipeline, deps: "-r requirements.lock" }
          - { dir: sensor-anomaly,    deps: "-r requirements.lock" }
          - { dir: power-demand,      deps: "-r requirements.lock" }
          - { dir: dart-analyzer,     deps: "-r requirements.lock" }
          - { dir: wildfire-watch,    deps: "-r requirements.lock" }
          - { dir: data-agent,        deps: "-r requirements.lock" }
          - { dir: warehouse,         deps: "-r requirements.lock" }
          - { dir: energy-transition, deps: "-r requirements.lock" }
          - { dir: job-calendar,      deps: "-r requirements.lock" }
          - { dir: er-access,         deps: "-r requirements.lock" }
          - { dir: crash-hotspots,    deps: "-r requirements.lock" }
          - { dir: public-data-mcp,   deps: "-r requirements.lock" }
          - { dir: krgeo,             deps: "-e .[test]" }
          - { dir: map-tiles,         deps: "-r requirements.lock" }
          - { dir: pipeline-status,   deps: "-r requirements.lock" }
          - { dir: er-finder,         deps: "-r requirements.lock" }
    defaults: { run: { working-directory: "${{ matrix.dir }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install ${{ matrix.deps }}
          if [ "${{ matrix.dir }}" = "api-watch" ]; then python manage.py test tests; else python -m pytest -q; fi

  warehouse-airflow:     # DAG 가 실제 Airflow 에서 끝까지 도는지 (Docker 없이, dbt 는 별도 가상환경)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: warehouse } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .dbt && .dbt/bin/pip install -q "dbt-duckdb>=1.9,<2"
      - run: pip install -q "apache-airflow>=3,<4" duckdb
      - name: airflow dags test
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: |
          export AIRFLOW_HOME=$PWD/airflow_home AIRFLOW__CORE__DAGS_FOLDER=$PWD/dags DBT_BIN=$PWD/.dbt/bin/dbt
          airflow db migrate > /dev/null 2>&1
          airflow dags test warehouse_daily 2026-11-13 2>&1 | tee af.log | grep -E "Done. Returned|DagRun Finished|Marking run|Error|error:" | cut -c1-400
          grep -q "state:running.*successful\|Marking run.*successful" af.log
          test -f exports/fct_demand_hourly/demand_date=2025-11-13/part.parquet

  cdn-integrity:         # 지도·차트 페이지의 CDN 스크립트가 고정한 SRI 해시와 실제 파일이 같은지
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/check_sri.py --fetch
