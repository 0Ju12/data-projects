name: geo daily update
on:
  schedule: [{ cron: "17 21 * * *" }]   # 매일 06:17 KST
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write, actions: read }
jobs:
  update:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: geo-data-pipeline } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }   # 다시 실행해도 항상 최신 main 에서 시작
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && python -m pytest -q
      - run: python -m geopipe.cli run
      - name: 산불 탐지·화재기상지수 갱신 (실패해도 지진 갱신은 계속)
        id: fire
        continue-on-error: true
        working-directory: wildfire-watch
        run: python -m pytest -q && python -m firewatch.cli run
      - name: 웨어하우스 — dbt 모델·테스트·변경 이력, 실행 기록 (실패해도 다른 갱신은 계속)
        id: warehouse
        continue-on-error: true
        working-directory: warehouse
        run: |
          pip install -q -r requirements.txt
          python -m wh.cli collect-jobs || echo "채용 공고 수집 실패 — 모아 둔 자료로 계속"
          python -m wh.cli collect-market || echo "시세·환율 수집 실패 — 모아 둔 자료로 계속"
          python -m wh.cli collect-packages || echo "패키지 내려받기 수 수집 실패 — 모아 둔 자료로 계속"
          python -m wh.cli collect-disasters || echo "재해 경보 수집 실패 — 모아 둔 자료로 계속"
          python -m wh.cli run --date "$(date -u +%F)" | grep -v '"error"' ; rc=${PIPESTATUS[0]}
          python -m wh.cli report || true
          exit $rc
      - name: 신입 IT 공고 달력 — 점핏·카카오·Greenhouse 공개 공고 수집 (실패해도 다른 갱신은 계속, 실패한 출처는 이전 공고 유지)
        id: jobs
        continue-on-error: true
        working-directory: job-calendar
        run: python -m pytest -q && python -m jobcal.cli collect
      - name: 전력 전환 분석 — Ember·OWID 공개 자료 갱신 (실패해도 다른 갱신은 계속, 받기 실패 시 이전 파일 유지)
        id: energy
        continue-on-error: true
        working-directory: energy-transition
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q
          python -m etl.fetch || echo "일부 원본 받기 실패 — 이전 파일로 계속"
          python -m etl.analyze
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs ../wildfire-watch/data ../wildfire-watch/docs/data.json ../warehouse/runs ../warehouse/state ../warehouse/data ../warehouse/docs ../energy-transition/data ../energy-transition/docs ../job-calendar/data ../job-calendar/docs
          git diff --cached --quiet || git commit -m "geo: daily update $(date -u +%F)"
          git pull --rebase origin main   # 그 사이 다른 커밋이 올라왔어도 밀리지 않게
          git push
      - uses: actions/checkout@v4
        with: { repository: 0Ju12/gravmag-wcf, path: _wcf }
      - name: 다른 프로젝트의 페이지를 같은 Pages 에 포함 (/power/ · /fire/ · /wcf/ · /warehouse/ · /energy/ · /jobs/ · /er/ · /near/ · /tiles/)
        run: |
          rm -rf docs/power docs/fire docs/wcf docs/warehouse docs/energy docs/jobs docs/er docs/crash docs/near
          cp -r ../job-calendar/docs docs/jobs
          cp -r ../power-demand/explorer docs/power
          cp -r ../wildfire-watch/docs docs/fire
          cp -r ../_wcf/web docs/wcf
          if [ -f ../warehouse/docs/index.html ]; then cp -r ../warehouse/docs docs/warehouse; fi
          if [ -f ../energy-transition/docs/index.html ]; then cp -r ../energy-transition/docs docs/energy; fi
          if [ -f ../api-watch/public/index.html ]; then cp -r ../api-watch/public docs/api-watch; fi
          if [ -f ../er-access/docs/index.html ]; then cp -r ../er-access/docs docs/er; fi
          if [ -f ../er-finder/docs/grid.json ]; then cp -r ../er-finder/docs docs/near; fi   # 가까운 응급실 찾기 (PWA)
          if [ -f ../crash-hotspots/docs/data.json ]; then cp -r ../crash-hotspots/docs docs/crash; fi   # 사고 자료로 build 한 뒤에만 공개
      - name: 타일 지도 — 세 프로젝트 산출물을 PMTiles 하나로 굽기 (/tiles/, 실패해도 다른 페이지는 배포)
        id: tiles
        continue-on-error: true
        run: |
          rm -rf docs/tiles
          (cd ../map-tiles && python -m tiles.build) && cp -r ../map-tiles/docs docs/tiles
      - name: 파이프라인 상태판 — 실행 기록·숨은 단계 실패·산출물 신선도 (/status/, 실패해도 배포는 계속)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STEP_OUTCOMES: ${{ toJSON(steps) }}   # continue-on-error 로 가려진 단계 실패(outcome)를 상태판에 넘김
        run: |
          rm -rf docs/status
          (cd ../pipeline-status && python -m status.collect --repo "${{ github.repository }}") && cp -r ../pipeline-status/docs docs/status
      - uses: actions/upload-pages-artifact@v3
        with: { path: geo-data-pipeline/docs }
  deploy:
    concurrency: { group: pages-deployment, cancel-in-progress: false }
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
