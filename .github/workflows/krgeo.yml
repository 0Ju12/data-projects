name: krgeo
on:
  push:
    paths: ["krgeo/**", ".github/workflows/krgeo.yml"]
    tags: ["krgeo-v*"]
  pull_request:
    paths: ["krgeo/**", ".github/workflows/krgeo.yml"]

defaults: { run: { working-directory: krgeo } }

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install ".[test]" && python -m pytest -q
      - name: numpy 없이도 핵심 기능이 import 되는지
        run: |
          python -m venv /tmp/bare && /tmp/bare/bin/pip install -q .
          cd / && /tmp/bare/bin/python -c "import krgeo, krgeo.hotosm, krgeo.access, krgeo.regions, krgeo.hotspot; print(krgeo.to_utmk(38, 127.5))"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: { name: krgeo-dist, path: krgeo/dist/ }

  publish:                      # 태그를 올렸을 때만, PyPI trusted publishing (토큰 없음)
    if: startsWith(github.ref, 'refs/tags/krgeo-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: krgeo-dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist/ }
