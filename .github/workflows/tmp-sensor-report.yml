# 임시: UCI 원본으로 sensor-anomaly 결과를 다시 계산해 이 브랜치에 커밋 (PR 전에 삭제)
name: tmp sensor report
on:
  push:
    branches: [claude/project-thread-x1cc8u]
    paths: [".github/workflows/tmp-sensor-report.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r sensor-anomaly/requirements.lock
      - run: cd sensor-anomaly && python -m sensoranom.run
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sensor-anomaly/reports
          git commit -m "sensor-anomaly: UCI 원본으로 결과 다시 계산 (전진 연쇄 CV 포함)" || exit 0
          git push origin HEAD:claude/project-thread-x1cc8u
